<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undervisningsutveckling</title>
</head>

<style>
    button {
        width: 150px;
        background: #aaaaaa;
        color: black;
        border: none;
        border-radius: 10px;
        padding: 20px 30px;
        font-size: 20px;
        cursor: pointer;
    }

    textarea {
        width: 100%;
        height: 150px;
        box-sizing: border-box;
        padding: 20px;
        font-size: 20px;
        line-height: 1.5;
        border: 2px solid #aaaaaa;
        border-radius: 10px;
        resize: vertical;
        margin: 20px 0;
    }

    @media screen and (max-width: 1024px) {
        textarea {
            height: 300px;
        }
    }
</style>

<body>
    <div>
        <h1>
            Undervisningsutveckling
        </h1>

        <button onclick="generate()">
            Knappen
        </button>

        <button onclick="document.getElementById('result').value = ''">
            Rensa
        </button>

        <br><br>

        <textarea id="result" readonly
            placeholder="Tryck på knappen för att skapa framtidens pedagogiska utmaningar!"></textarea>
    </div>

    <script src="./dictionary.js"></script>

    <script>

        function randomize(list, capitalize = false) {
            const word = list[Math.floor(Math.random() * list.length)];
            return capitalize ? capitalizeFirstLetter(word) : word;
        }

        function capitalizeFirstLetter(str) {
            return String(str).charAt(0).toUpperCase() + String(str).slice(1);
        }

            const sentence = template()
                .replace(/\s+/g, " ")
                .trim();

            document.getElementById("result").value = sentence;
            return sentence;
        }




    </script>
</body>

</html>
