<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undervisningsutveckling</title>

    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <link rel="stylesheet" href="./style.css">
</head>


<body>
    <div>
        <h1>
            Undervisningsutveckling
        </h1>
        
        <button id="generateButton">
            Knappen
        </button>

        <button id="clearButton">
            <span class="iconify" data-icon="mdi-backspace-outline"></span>
        </button>

        <button id="copyButton">
            <span class="iconify" data-icon="mdi-content-copy"></span>
        </button>

        <textarea id="output" readonly
            placeholder="Tryck på knappen för att skapa framtidens pedagogiska utmaningar!"></textarea>

    </div>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
